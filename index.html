
<style>
.novel-section {
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
.novel-section h2 {
  text-align: center;
  color: #f5c542;
}
.novel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 15px;
}
.novel-card {
  background: #202e43;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}
.novel-cover {
  font-size: 55px;
  padding: 15px;
  background: #34445c;
  border-radius: 10px;
}
.novel-card h3 { font-size: 16px; }
.novel-card p { font-size: 13px; color: #ccc; }
.novel-card button {
  background: #f5c542;
  color: #111;
  border: 0;
  padding: 10px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}
#novelReader {
  display: none;
  background: #202e43;
  padding: 20px;
  margin-top: 20px;
  border-radius: 12px;
  line-height: 1.8;
}
#novelReader button {
  background: #f5c542;
  padding: 10px;
  border: 0;
  border-radius: 6px;
}
</style>

<section class="novel-section">
  <h2>📚 Explore Our 8 New Novels</h2>
  <div class="novel-grid" id="novelGrid"></div>
  <div id="novelReader">
    <button onclick="closeNovel()">✖ Close</button>
    <h2 id="readerTitle"></h2>
    <h3 id="readerChapter"></h3>
    <p id="readerText"></p>
  </div>
</section>

<script>
const novels = [
  {
    title: "The Billionaire's Secret",
    cover: "💎",
    genre: "Romance",
    description: "A young woman discovers that the mysterious billionaire has been hiding a secret.",
    chapter: "Chapter One",
    text: "Amara never believed that one meeting could change her entire life. But when she walked into the grand office of Daniel Williams, everything she knew about love and wealth began to change. He looked at her and smiled. 'I have been waiting for you,' he whispered."
  },
  {
    title: "Love Beyond Destiny",
    cover: "❤️",
    genre: "Romance",
    description: "Two strangers meet and discover that destiny has a plan for them.",
    chapter: "Chapter One",
    text: "Rain poured across the city as Sarah ran through the streets. She bumped into a stranger carrying a black umbrella. Their eyes met, and for a moment, the busy city seemed completely silent."
  },
  {
    title: "The Forgotten Princess",
    cover: "👑",
    genre: "Fantasy",
    description: "A forgotten princess returns to reclaim her family's kingdom.",
    chapter: "Chapter One",
    text: "Deep inside the ancient forest, a young girl discovered a golden necklace. Unknown to her, the necklace belonged to the royal family that had disappeared many years ago."
  },
  {
    title: "My Enemy, My Love",
    cover: "💕",
    genre: "Romance",
    description: "A family rivalry turns into an unexpected love story.",
    chapter: "Chapter One",
    text: "Jessica hated everything about Michael. Their families had been enemies for generations. But when they were forced to work together, she discovered that he was not the person she imagined."
  },
  {
    title: "The Dark Mansion",
    cover: "🏚️",
    genre: "Mystery",
    description: "A mysterious mansion holds secrets nobody dares to uncover.",
    chapter: "Chapter One",
    text: "Nobody entered the mansion after sunset. Strange sounds came from its windows, and the neighbours refused to discuss what happened there. One evening, David decided to discover the truth."
  },
  {
    title: "A Second Chance",
    cover: "🌹",
    genre: "Drama",
    description: "After heartbreak, a woman gets another opportunity to find happiness.",
    chapter: "Chapter One",
    text: "Three years had passed since Emma's heart was broken. She promised herself never to love again. Then one unexpected phone call changed everything."
  },
  {
    title: "The Secret Heiress",
    cover: "💰",
    genre: "Drama",
    description: "A poor young woman discovers she is the heir to a powerful family.",
    chapter: "Chapter One",
    text: "Lily lived a simple life, working every day to support herself. She never imagined that a lawyer would arrive at her doorstep with documents revealing her true identity."
  },
  {
    title: "Whispers of the Moon",
    cover: "🌙",
    genre: "Fantasy",
    description: "A young woman discovers a magical power connected to the moon.",
    chapter: "Chapter One",
    text: "Every full moon, strange dreams visited Elena. One night, she woke up with a glowing symbol on her wrist. The old woman in the village saw it and immediately fell to her knees."
  }
];

const grid = document.getElementById("novelGrid");

novels.forEach((novel, index) => {
  const card = document.createElement("div");
  card.className = "novel-card";

  const cover = document.createElement("div");
  cover.className = "novel-cover";
  cover.textContent = novel.cover;

  const title = document.createElement("h3");
  title.textContent = novel.title;

  const genre = document.createElement("p");
  genre.textContent = novel.genre;

  const description = document.createElement("p");
  description.textContent = novel.description;

  const button = document.createElement("button");
  button.textContent = "Read Novel";
  button.addEventListener("click", () => openNovel(index));

  card.append(cover, title, genre, description, button);
  grid.appendChild(card);
});

function openNovel(index) {
  const novel = novels[index];

  document.getElementById("readerTitle").textContent = novel.title;
  document.getElementById("readerChapter").textContent = novel.chapter;
  document.getElementById("readerText").textContent = novel.text;
  document.getElementById("novelReader").style.display = "block";

  document.getElementById("novelReader").scrollIntoView({
    behavior: "smooth"
  });
}

function closeNovel() {
  document.getElementById("novelReader").style.display = "none";
}
</script>
